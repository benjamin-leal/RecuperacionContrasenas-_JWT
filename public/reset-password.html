<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña</title>
<main>
  <h1>Recuperar contraseña</h1>
  <form>
    <label>Nueva contraseña (8 a 72 caracteres)
      <input type="password" required minlength="8" maxlength="72" autocomplete="new-password">
    </label>
    <button>Guardar contraseña</button>
  </form>
  <p role="status"></p>
</main>
<script>
  const token = location.hash.slice(1);
  history.replaceState(null, "", location.pathname);
  const form = document.querySelector("form");
  const message = document.querySelector('[role="status"]');
  form.onsubmit = async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    try {
      const response = await fetch("/api/auth/password/reset", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({reset_token: token, new_password: form.querySelector("input").value})
      });
      if (response.status === 204) {
        form.reset();
        form.hidden = true;
        message.textContent = "Contraseña actualizada. Ya puedes iniciar sesión.";
      } else {
        message.textContent = (await response.json()).message;
      }
    } catch {
      message.textContent = "No se pudo completar la solicitud. Vuelve a intentarlo.";
    } finally {
      button.disabled = false;
    }
  };
</script>
</html>
